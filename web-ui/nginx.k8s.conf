# K8s 배포 환경에서는 /products 라우팅을 Ingress가 담당하므로
# 이 설정에는 product-service로의 proxy_pass 블록을 포함하지 않는다.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /health {
        proxy_pass http://product-service:8000;
        proxy_set_header Host $host;
    }
}

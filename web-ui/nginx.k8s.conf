# K8s 배포 환경에서는 /products 라우팅을 Ingress가 담당하므로
# 이 설정에는 product-service로의 proxy_pass 블록을 포함하지 않는다.
# /health는 Product Service 전용 엔드포인트로, Web UI의 헬스체크는 / 경로만 사용한다.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

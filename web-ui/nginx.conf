# 로컬 docker-compose 환경에서 Web UI가 상대 경로(fetch('/products', ...))로 API를 호출할 수 있도록
# product-service로 프록시한다. 실제 K8s 배포 환경에서는 이 역할을 Ingress가 대신한다.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /products {
        proxy_pass http://product-service:8000;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://product-service:8000;
        proxy_set_header Host $host;
    }
}

{{- with .Values.postgres }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .label }}
  namespace: {{ $.Values.global.namespace }}
spec:
  serviceName: {{ .label }}-service
  replicas: {{ .replicas }}
  selector:
    matchLabels:
      app: {{ .label }}
  template:
    metadata:
      labels:
        app: {{ .label }}
    spec:
      containers:
        - name: {{ .label }}
          image: "{{ .image }}"
          ports:
            - containerPort: {{ .containerPort }}
          env:
            - name: POSTGRES_DB
              value: "{{ .db.name }}"
            - name: POSTGRES_USER
              value: "{{ .db.user }}"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.credentials.db }}
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: {{ .label }}-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: {{ .resources.requests.cpu }}
              memory: {{ .resources.requests.memory }}
            limits:
              cpu: {{ .resources.limits.cpu }}
              memory: {{ .resources.limits.memory }}
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .db.user }}", "-d", "{{ .db.name }}"]
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .db.user }}", "-d", "{{ .db.name }}"]
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .db.user }}", "-d", "{{ .db.name }}"]
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: {{ .label }}-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .storage.className }}
        resources:
          requests:
            storage: {{ .storage.size }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jypjt
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/juyeoon/k8s-product-image-pipeline.git
    targetRevision: main
    path: charts/jypjt
  destination:
    server: https://kubernetes.default.svc
    namespace: jypjt
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: web-ui
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: product-service
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: image-processing-service
      jsonPointers:
        - /spec/replicas
